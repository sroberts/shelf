name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The web UI is embedded in the binary, so it is built first. Without
      # this step the binary would serve a "UI not built" page.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: npm ci && npm test && npm run build

      - name: Check the UI is embedded
        env:
          SHELF_REQUIRE_UI: "1"
        run: go test ./internal/ui/

      - name: Build static binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/shelf ./cmd/shelf

      - name: Package archive
        run: |
          cp README.md LICENSE dist/
          ARCHIVE="shelf-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czvf "$ARCHIVE" -C dist shelf README.md LICENSE
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shelf-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            shelf-*.tar.gz
            shelf-*.sha256

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate consolidated checksums
        working-directory: release-assets
        run: |
          # SHA256SUMS is the name `outpost add` and `outpost update` look for
          # to verify a download; sha256sums.txt is kept for existing scripts.
          cat *.sha256 > SHA256SUMS
          cp SHA256SUMS sha256sums.txt
          rm -f *.sha256

      - name: Attach the Outpost descriptor
        # Attached to the release rather than only kept in the repo, so the
        # copy Outpost reads is the one that shipped with these binaries.
        run: cp outpost.toml release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
