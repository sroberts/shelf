run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused

linters-settings:
  govet:
    enable-all: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
    - path: internal/convert/cache_test\.go
      text: "SA4000"
    - path: internal/library/book\.go
      text: "tagsFlat"
    - path: internal/tui/syncview\.go
      text: "syncStoppedMsg"
